server:
  port: ${PORT:8080}  # Render会提供PORT环境变量

spring:
  application:
    name: tyl-system
  datasource:
    # 自动检测数据库类型（MySQL或PostgreSQL）
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/tyl_system?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    
  # JPA配置（PostgreSQL需要）
  jpa:
    hibernate:
      ddl-auto: none  # 不自动创建表，使用SQL脚本
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.MySQL5InnoDBDialect}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.tyl.system.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl  # 生产环境关闭SQL日志

# JWT配置
jwt:
  secret: ${JWT_SECRET:tylSystemSecretKey2024ProductionStronger}  # 生产环境建议使用环境变量
  expiration: 86400000  # 24小时

# 日志配置
logging:
  level:
    root: INFO
    com.tyl.system: INFO
  file:
    name: logs/tyl-system.log
    max-size: 10MB
    max-history: 30
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
