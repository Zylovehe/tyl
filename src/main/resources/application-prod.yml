server:
  port: ${PORT:8080}

spring:
  application:
    name: tyl-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQLUSER}
    password: ${MYSQLPASSWORD}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-init.sql

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.tyl.system.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      table-underline: true

# JWT配置
jwt:
  secret: ${JWT_SECRET:tylSystemSecretKey2024ProductionStronger}
  expiration: 86400000

# 日志配置
logging:
  level:
    root: INFO
    com.tyl.system: INFO
  file:
    name: logs/tyl-system.log
    max-size: 10MB
    max-history: 30
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
