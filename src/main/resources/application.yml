server:
  port: 8080

spring:
  application:
    name: tyl-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQLUSER}
    password: ${MYSQLPASSWORD}
    schema: classpath:schema-init.sql
    sql:
    init:
      mode: always
    

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.tyl.system.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  global-config:
    db-config:
      # 开启根据实体自动建表
      table-underline: true
    # 关闭spring自动执行sql（避免配置冲突）
  spring:
   sql:
    init:
      mode: never 

# JWT配置
jwt:
  secret: tylSystemSecretKey2024
  expiration: 86400000  # 24小时
