# Render.com 部署配置
# 注意: repo和branch应在Render Dashboard中通过GitHub连接时设置
# 需要手动填写的环境变量(DB_HOST, DB_PORT, DB_USERNAME, DB_PASSWORD, DB_NAME, JWT_SECRET)请在Render Dashboard中添加
services:
  - type: web
    name: tyl-backend
    runtime: java
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/*.jar
    envVars:
      # Spring Boot配置（已预设值）
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_DRIVER
        value: com.mysql.cj.jdbc.Driver
    healthCheckPath: /api/auth/login
    autoDeploy: true
