# Render.com 部署配置
# 注意: repo和branch应在Render Dashboard中通过GitHub连接时设置
services:
  - type: web
    name: tyl-backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/*.jar
    envVars:
      # Spring Boot配置（预设值）
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_DRIVER
        value: com.mysql.cj.jdbc.Driver
      # Aiven MySQL数据库配置（需要在Render Dashboard手动填写）
      - key: DB_HOST
      - key: DB_PORT
      - key: DB_USERNAME
      - key: DB_PASSWORD
      - key: DB_NAME
      # JWT密钥（需要在Render Dashboard手动填写）
      - key: JWT_SECRET
    healthCheckPath: /api/auth/login
    autoDeploy: true
